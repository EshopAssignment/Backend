services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Bytmig123!"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Bytmig123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  tests:
    build:
      context: .
      dockerfile: IntegrationTests/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Test"
      ConnectionStrings__DefaultConnection: "Server=db;Database=EshopTestDb;User Id=sa;Password=Bytmig123!;TrustServerCertificate=True;Encrypt=False;"
      Stripe__SecretKey: "dummy"
      Jwt__Issuer: "Pallshoppen"
      Jwt__Audience: "Pallshoppen.Client"
      Jwt__Key: "dummy-dummy-dummy-dummy"
    command: >
      dotnet test ./IntegrationTests/IntegrationTests.csproj
      -c Release
      --no-build
      -l "trx;LogFileName=test_results.trx"
      -l "console;verbosity=detailed"
