services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Bytmig123!"
  tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ./:/src
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: "Test"
      ConnectionStrings__DefaultConnection: "Server=db;Database=EshopTestDb;User Id=sa;Password=Bytmig123!;TrustServerCertificate=True;Encrypt=False;"
      Stripe__SecretKey: "dummy"
      Jwt__Issuer: "Pallshoppen"
      Jwt__Audience: "Pallshoppen.Client"
      Jwt__Key: "dummy-dummy-dummy-dummy"
    command: >
      bash -lc "dotnet test ./IntegrationTests/IntegrationTests.csproj -c Release --logger 'trx;LogFileName=test_results.trx'"

