services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"

      # DB: viktigt att detta heter exakt som du använder i Program.cs
      ConnectionStrings__DefaultConnection: "Server=db;Database=EshopDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False;"

      # Stripe/PostNord/JWT: sätt via env i docker så du slipper committa hemligheter
      Stripe__SecretKey: "s"
      Stripe__PublishableKey: "m"
      Stripe__WebhookSecret: "w"

      PostNord__BaseUrl: "https://atapi2.postnord.com/rest/businesslocation"
      PostNord__ApiKey: "din-nyckel-här"

      Jwt__Issuer: "Pallshoppen"
      Jwt__Audience: "Pallshoppen.Client"
      Jwt__Key: "byt-ut-den-här-i-riktig-miljö"
    ports:
      - "8080:8080"

volumes:
  mssql_data:
