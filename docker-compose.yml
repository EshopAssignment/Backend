
  # Generated by gpt 5.2

services:
  api:
    container_name: pallshoppen-api
    build:
      context: .
      dockerfile: Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ConnectionStrings__DefaultConnection: "Server=db;Database=${MSSQL_DB:-EshopDb};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eshop-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - eshop_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" -C || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  db_test:
    profiles: ["test"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    tmpfs:
      - /var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" -C || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Api/Dockerfile
    depends_on:
      db_test:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__DefaultConnection: "Server=db_test;Database=${MSSQL_DB:-EshopDb};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    command: ["dotnet", "test", "-c", "Release", "--logger:trx"]

volumes:
  eshop_sql_data:
