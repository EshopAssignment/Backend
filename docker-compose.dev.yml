services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pallshoppen-db-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Bytmig123!"
    ports:
      - "1433:1433"
    volumes:
      - pallshoppen_sql_dev:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Bytmig123!\" -C -Q \"SELECT 1\" > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
  
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: pallshoppen-stripe-dev
    environment:
      STRIPE_API_KEY: ${STRIPE_API_KEY}
    command: >
      listen
      --api-key ${STRIPE_API_KEY}
      --events payment_intent.succeeded,payment_intent.payment_failed,charge.succeeded,charge.updated
      --forward-to http://host.docker.internal:5005/api/payments/webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:latest
    container_name: pallshoppen-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pallshoppen-rabbitmq
    hostname: rabbitmq
    environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
        interval: 10s
        timeout: 5s
        retries: 10

volumes:
  pallshoppen_sql_dev:
